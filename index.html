<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rui Zhong, Ph.D. student at Zhejiang University. Academic homepage coming soon.">
  <meta name="color-scheme" content="light">
  <meta property="og:title" content="Rui Zhong — Academic Homepage">
  <meta property="og:description" content="Ph.D. student at Zhejiang University. Full website coming soon.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://zrrraa.github.io/">
  <link rel="canonical" href="https://zrrraa.github.io/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23294963'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial' font-size='27' fill='white'%3ERZ%3C/text%3E%3C/svg%3E">
  <title>Rui Zhong — Academic Homepage</title>
  <style>
    *{box-sizing:border-box}html{min-height:100%;background:#fafbf9}body{margin:0;color:#263640;font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:5px}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible{outline:2px solid #527b99;outline-offset:5px;border-radius:2px}::selection{background:#dce8ed}main{max-width:1000px;min-height:100svh;margin:auto;padding:38px 48px 30px;display:flex;flex-direction:column}.topline{display:flex;align-items:center;justify-content:space-between;gap:24px}.wordmark{font-size:12px;font-weight:600;letter-spacing:.015em}.language{display:flex;align-items:center;gap:8px;color:#abb2b5;font-size:11px}.language button{border:0;background:none;color:#899398;padding:6px 2px;min-height:30px}.language button[aria-pressed=true]{color:#294963;font-weight:700}.intro{flex:1;display:flex;flex-direction:column;justify-content:center;padding:90px 0 110px;max-width:620px}.eyebrow{font-size:10px;color:#79909b;letter-spacing:.16em;text-transform:uppercase;margin:0 0 25px}.name{font-size:clamp(48px,8vw,76px);font-weight:500;letter-spacing:-.055em;line-height:1.08;margin:0 0 21px}.affiliation{font-size:14px;color:#6d7c85;line-height:1.9;margin:0}.status{border-top:1px solid #dce2e4;margin-top:45px;padding-top:25px;max-width:465px}.status h2{font-family:Georgia,'Songti SC',serif;font-size:29px;line-height:1.3;font-weight:400;letter-spacing:-.025em;margin:0 0 11px}.status p{font-size:13px;line-height:1.8;color:#7b8991;margin:0}.links{display:flex;flex-wrap:wrap;gap:24px;margin-top:28px;font-size:12px;color:#3a6078}.links a{display:inline-flex;align-items:center;gap:8px;padding:5px 0}.links span{color:#9babb4}.footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #e2e7e8;padding-top:18px;color:#9aa5ac;font-size:10px;line-height:1.8}html[lang=zh-CN] .name{letter-spacing:.04em}html[lang=zh-CN] .status h2{font-family:inherit;font-size:26px;font-weight:400;letter-spacing:.04em}@media(max-width:600px){main{padding:25px 27px 23px}.intro{padding:75px 0 90px}.eyebrow{font-size:9px;margin-bottom:22px}.name{font-size:51px}.affiliation{font-size:13px}.status{margin-top:35px;padding-top:23px}.status h2{font-size:27px}.status p{font-size:12px}.footer{font-size:9px}.links{gap:21px;font-size:12px}}
  </style>
</head>
<body>
  <main>
    <header class="topline"><a class="wordmark" href="https://zrrraa.github.io/">Rui Zhong</a><div class="language" role="group" aria-label="Language"><button data-lang="zh" lang="zh-CN" aria-pressed="false">中文</button><span aria-hidden="true">/</span><button data-lang="en" lang="en" aria-pressed="true">EN</button></div></header>
    <section class="intro" aria-labelledby="name">
      <p class="eyebrow" data-copy="eyebrow">Academic homepage</p>
      <h1 id="name" class="name" data-copy="name">Rui Zhong</h1>
      <p class="affiliation" data-copy="role">Ph.D. Student · College of Integrated Circuits</p>
      <p class="affiliation" data-copy="university">Zhejiang University</p>
      <div class="status"><h2 data-copy="heading">Coming soon.</h2><p data-copy="message">A new home for my research, projects, and life beyond the lab.</p></div>
      <nav class="links" aria-label="Contact"><a href="mailto:rzhong@zju.edu.cn"><span aria-hidden="true">↗</span><span data-copy="email" style="color:inherit">Email</span></a><a href="https://github.com/zrrraa" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">↗</span>GitHub</a></nav>
    </section>
    <footer class="footer"><span>© 2026 Rui Zhong</span><span data-copy="location">Hangzhou, China</span></footer>
  </main>
  <script>
    const copy={en:{eyebrow:'Academic homepage',name:'Rui Zhong',role:'Ph.D. Student · College of Integrated Circuits',university:'Zhejiang University',heading:'Coming soon.',message:'A new home for my research, projects, and life beyond the lab.',email:'Email',location:'Hangzhou, China'},zh:{eyebrow:'学术主页',name:'钟睿',role:'博士研究生 · 集成电路学院',university:'浙江大学',heading:'即将上线。',message:'我的研究、项目，以及研究之外的生活，将在这里与你见面。',email:'电子邮箱',location:'中国 · 杭州'}};
    function setLanguage(lang){
      if(!copy[lang])lang='en';
      document.documentElement.lang=lang==='zh'?'zh-CN':'en';
      document.querySelectorAll('[data-copy]').forEach(el=>el.textContent=copy[lang][el.dataset.copy]);
      document.querySelectorAll('[data-lang]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.lang===lang)));
      document.querySelector('.wordmark').textContent=copy[lang].name;
      document.querySelector('.language').setAttribute('aria-label',lang==='zh'?'语言':'Language');
      document.querySelector('.links').setAttribute('aria-label',lang==='zh'?'联系方式':'Contact');
      document.title=lang==='zh'?'钟睿 — 学术主页即将上线':'Rui Zhong — Academic Homepage';
      document.querySelector('meta[name=description]').content=lang==='zh'?'钟睿，浙江大学集成电路学院博士研究生。学术主页即将上线。':'Rui Zhong, Ph.D. student at Zhejiang University. Academic homepage coming soon.';
    }
    let language=new URLSearchParams(location.search).get('lang');
    if(!['zh','en'].includes(language)){try{language=localStorage.getItem('rui-coming-soon-language');}catch{}}
    setLanguage(language);
    document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{
      const lang=button.dataset.lang;setLanguage(lang);
      try{localStorage.setItem('rui-coming-soon-language',lang);}catch{}
      const url=new URL(location.href);url.searchParams.set('lang',lang);history.replaceState(null,'',url);
    }));
  </script>
</body>
</html>
